[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mi-automatizador"
version = "3.0.0"
description = "Automatizador de archivos Excel a PDF, Word y CSV"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tu Nombre", email = "tu@email.com" }]
dependencies = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
    "pytest>=8.0",
]

[project.scripts]
mi-automatizador = "mi_automatizador.cli:main"